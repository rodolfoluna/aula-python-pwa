services:
  - type: web
    name: aula-python-consola
    runtime: static
    buildCommand: node scripts/build-runner.mjs
    staticPublishPath: build/runner
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cache-Control
        value: no-cache
  - type: web
    name: aula-python
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:production
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: RUNNER_HOSTNAME
        fromService:
          type: web
          name: aula-python-consola
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
